<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities — TX Dashboard</title>
  <script src="tx_shared.js"></script>
  <style>
    /* ─── PAGE BASE ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #0f172a;
      min-height: 100vh;
    }

    /* ─── SUMMARY BAR ─── */
    .opp-summary-bar {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .opp-summary-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .opp-summary-value {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
    }
    .opp-summary-value.green  { color: #16a34a; }
    .opp-summary-value.blue   { color: #2563eb; }
    .opp-summary-value.amber  { color: #d97706; }
    .opp-summary-value.red    { color: #dc2626; }
    .opp-summary-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    .opp-summary-divider {
      width: 1px;
      height: 36px;
      background: #e2e8f0;
    }

    /* ─── TOOLBAR (type filter + status filter) ─── */
    .opp-toolbar {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .opp-toolbar-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: 2px;
    }
    .opp-type-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      color: #475569;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .opp-type-btn:hover { border-color: #94a3b8; color: #0f172a; }
    .opp-type-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
    .opp-type-btn.type-BILLING_GAP.active   { background: #dc2626; border-color: #dc2626; }
    .opp-type-btn.type-API_ZERO.active      { background: #7c3aed; border-color: #7c3aed; }
    .opp-type-btn.type-LOW_TAKE_RATE.active { background: #d97706; border-color: #d97706; }
    .opp-type-btn.type-PENETRATION_UPSIDE.active { background: #2563eb; border-color: #2563eb; }
    .opp-type-btn.type-NO_ACTIVITY.active   { background: #64748b; border-color: #64748b; }
    .opp-toolbar-sep { width: 1px; height: 22px; background: #e2e8f0; margin: 0 4px; }

    /* Confidence filter buttons */
    .opp-conf-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      color: #475569;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .opp-conf-btn:hover { border-color: #94a3b8; color: #0f172a; }
    .opp-conf-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .opp-conf-btn.conf-HIGH.active    { background: #16a34a; border-color: #16a34a; }
    .opp-conf-btn.conf-INVESTIGATE.active { background: #d97706; border-color: #d97706; }

    .opp-status-btn {
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      color: #475569;
      cursor: pointer;
      transition: all 0.12s;
    }
    .opp-status-btn:hover { border-color: #94a3b8; }
    .opp-status-btn.active { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; font-weight: 600; }

    /* ─── CARDS AREA ─── */
    .opp-cards-area {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 40px;
    }
    .opp-results-meta {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .opp-results-meta strong { color: #0f172a; }

    /* ─── OPPORTUNITY CARD ─── */
    .opp-card {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 16px 12px;
      margin-bottom: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .opp-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .opp-card.status-approved  { border-color: #16a34a; background: #f0fdf4; }
    .opp-card.status-rejected  { border-color: #dc2626; background: #fef2f2; opacity: 0.7; }
    .opp-card.status-investigating { border-color: #2563eb; background: #eff6ff; }

    .opp-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .opp-card-title-block {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }
    .opp-type-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-BILLING_GAP        { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .badge-API_ZERO           { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }
    .badge-LOW_TAKE_RATE      { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .badge-PENETRATION_UPSIDE { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .badge-NO_ACTIVITY        { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }

    .opp-card-name {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
    }
    .opp-card-tier {
      font-size: 11px;
      color: #64748b;
    }
    .opp-card-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .opp-card-potential {
      font-size: 16px;
      font-weight: 700;
      color: #16a34a;
    }
    .opp-card-priority {
      font-size: 11px;
      color: #64748b;
    }
    .opp-card-priority span {
      font-weight: 600;
      color: #0f172a;
    }
    .opp-card-evidence {
      font-size: 11px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 4px;
      border-left: 3px solid #e2e8f0;
    }
    .opp-card-evidence .evidence-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 3px;
    }

    /* ─── CARD ACTIONS ─── */
    .opp-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .opp-action-btn {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .opp-btn-approve {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #bbf7d0;
    }
    .opp-btn-approve:hover, .opp-btn-approve.active {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
    }
    .opp-btn-reject {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .opp-btn-reject:hover, .opp-btn-reject.active {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
    .opp-btn-investigate {
      background: #eff6ff;
      color: #2563eb;
      border-color: #bfdbfe;
    }
    .opp-btn-investigate:hover, .opp-btn-investigate.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .opp-btn-comment-toggle {
      background: #fff;
      color: #475569;
      border-color: #e2e8f0;
      margin-left: auto;
    }
    .opp-btn-comment-toggle:hover {
      border-color: #94a3b8;
      color: #0f172a;
    }
    .opp-status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
    }
    .status-badge-approved     { background: #f0fdf4; color: #16a34a; }
    .status-badge-rejected     { background: #fef2f2; color: #dc2626; }
    .status-badge-investigating{ background: #eff6ff; color: #2563eb; }

    /* ─── COMMENT SECTION ─── */
    .opp-comment-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      display: none;
    }
    .opp-comment-section.open { display: block; }
    .opp-comment-area {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }
    .opp-comment-input {
      flex: 1;
      font-size: 11px;
      padding: 6px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      resize: vertical;
      min-height: 36px;
      font-family: inherit;
      color: #0f172a;
    }
    .opp-comment-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px #bfdbfe;
    }
    .opp-comment-save {
      font-size: 11px;
      font-weight: 500;
      padding: 6px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .opp-comment-save:hover { background: #f1f5f9; border-color: #94a3b8; }
    .opp-comment-saved {
      font-size: 10px;
      color: #16a34a;
      display: none;
      align-items: center;
      gap: 3px;
    }
    .opp-comment-display {
      font-size: 11px;
      color: #475569;
      padding: 4px 0 6px;
      font-style: italic;
    }

    /* ─── OUTCOME SECTION ─── */
    .opp-outcome-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      display: none;
    }
    .opp-outcome-section.open { display: block; }

    /* Record Action form */
    .opp-action-form {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-end;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }
    .opp-action-form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .opp-action-form-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.04em;
    }
    .opp-action-form-input {
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      font-family: inherit;
      color: #0f172a;
      background: #fff;
    }
    .opp-action-form-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px #bfdbfe;
    }
    .opp-action-form-input.wide { width: 220px; }
    .opp-action-form-input.medium { width: 130px; }
    .opp-action-form-input.narrow { width: 110px; }
    .opp-action-save {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 14px;
      border: 1px solid #2563eb;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      transition: all 0.12s;
      align-self: flex-end;
    }
    .opp-action-save:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .opp-action-saved-flash {
      font-size: 10px;
      color: #16a34a;
      display: none;
      align-items: center;
      gap: 3px;
      align-self: flex-end;
      padding-bottom: 4px;
    }
    .opp-action-saved-flash.show { display: flex; }

    /* Existing action display */
    .opp-action-display {
      font-size: 11px;
      color: #475569;
      padding: 6px 10px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 4px;
      margin-bottom: 8px;
      display: none;
    }
    .opp-action-display.has-data { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .opp-action-display .action-field { display: flex; gap: 4px; align-items: center; }
    .opp-action-display .action-key {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: #d97706;
      letter-spacing: 0.04em;
    }
    .opp-action-display .action-val { color: #0f172a; font-weight: 500; }
    .opp-action-edit-btn {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #fff;
      color: #475569;
      cursor: pointer;
      margin-left: auto;
    }
    .opp-action-edit-btn:hover { border-color: #94a3b8; color: #0f172a; }

    /* Outcome result card */
    .opp-outcome-result {
      padding: 10px 12px;
      border-radius: 6px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      display: none;
    }
    .opp-outcome-result.has-outcome { display: block; }
    .opp-outcome-result.outcome-converted { border-color: #16a34a; background: #f0fdf4; }
    .opp-outcome-result.outcome-not_converted { border-color: #dc2626; background: #fef2f2; }
    .opp-outcome-result.outcome-partial { border-color: #d97706; background: #fffbeb; }
    .opp-outcome-result.outcome-expired { border-color: #94a3b8; background: #f8fafc; }
    .opp-outcome-result-header {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 6px;
    }
    .opp-outcome-result.outcome-converted .opp-outcome-result-header { color: #16a34a; }
    .opp-outcome-result.outcome-not_converted .opp-outcome-result-header { color: #dc2626; }
    .opp-outcome-result.outcome-partial .opp-outcome-result-header { color: #d97706; }
    .opp-outcome-metrics {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 11px;
    }
    .opp-outcome-metric-col { display: flex; flex-direction: column; gap: 3px; }
    .opp-outcome-metric-period {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.04em;
    }
    .opp-outcome-metric-row { display: flex; gap: 6px; align-items: center; }
    .opp-outcome-metric-label { color: #64748b; }
    .opp-outcome-metric-val { font-weight: 600; color: #0f172a; }
    .opp-outcome-delta {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .opp-outcome-delta.pos { background: #f0fdf4; color: #16a34a; }
    .opp-outcome-delta.neg { background: #fef2f2; color: #dc2626; }
    .opp-outcome-status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      margin-left: auto;
      align-self: center;
    }
    .badge-outcome-converted     { background: #16a34a; color: #fff; }
    .badge-outcome-not_converted { background: #dc2626; color: #fff; }
    .badge-outcome-partial       { background: #d97706; color: #fff; }
    .badge-outcome-expired       { background: #94a3b8; color: #fff; }

    /* Outcomes section toggle button */
    .opp-btn-outcome-toggle {
      background: #fffbeb;
      color: #d97706;
      border-color: #fde68a;
    }
    .opp-btn-outcome-toggle:hover {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }

    /* Page-level outcomes summary bar */
    .opp-outcomes-summary {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 24px;
      display: none;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .opp-outcomes-summary.visible { display: flex; }
    .opp-outcomes-summary-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .opp-outcomes-summary-stat {
      font-size: 12px;
      color: #0f172a;
    }
    .opp-outcomes-summary-stat strong { color: #16a34a; }
    .opp-outcomes-summary-stat.amber strong { color: #d97706; }
    .opp-outcomes-summary-stat.red strong { color: #dc2626; }

    /* ─── EMPTY STATE ─── */
    .opp-empty {
      text-align: center;
      padding: 64px 24px;
      color: #94a3b8;
    }
    .opp-empty-icon { font-size: 36px; margin-bottom: 12px; }
    .opp-empty-title { font-size: 15px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .opp-empty-sub   { font-size: 12px; }

    /* ─── LOADING / ERROR ─── */
    .opp-loading {
      text-align: center;
      padding: 64px;
      color: #94a3b8;
      font-size: 13px;
    }
    .opp-error {
      margin: 24px;
      padding: 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      color: #dc2626;
      font-size: 12px;
    }

    /* ─── PROBABILITY BADGE ─── */
    .opp-prob-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .opp-prob-badge.prob-green { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .opp-prob-badge.prob-amber { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .opp-prob-badge.prob-red   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    /* ─── SO WHAT + ACTION TEXT ─── */
    .opp-card-sowhat {
      font-size: 11px;
      color: #2563eb;
      font-style: italic;
      margin: 4px 0 0;
    }
    .opp-card-action-text {
      font-size: 11px;
      color: #475569;
      margin: 3px 0 6px;
    }

    /* ─── DATA FRESHNESS ─── */
    .opp-freshness-bar {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 4px 24px;
      font-size: 10px;
      color: #94a3b8;
    }

    /* ─── DECISION FLOW LABEL ─── */
    .tx-decision-label {
      font-size: 10px;
      color: #2563eb;
      font-style: italic;
      margin: 4px 0 8px;
    }
    .opp-decision-bar {
      background: #eff6ff;
      border-bottom: 1px solid #dbeafe;
      padding: 6px 24px;
      display: none;
    }
    .opp-decision-bar.visible { display: block; }
  </style>
</head>
<body>

<!-- Filter bar injected by TXShared after nav -->
<div id="filter-container"></div>
<div id="scorecard-container"></div>

<!-- Data freshness -->
<div class="opp-freshness-bar" id="opp-freshness-bar" style="display:none">
  Data as of: <span id="opp-freshness-date">—</span>
</div>

<!-- Summary bar -->
<div class="opp-summary-bar" id="summary-bar">
  <div class="opp-loading">Loading opportunities…</div>
</div>

<!-- Type + status toolbar -->
<div class="opp-toolbar" id="opp-toolbar" style="display:none">
  <span class="opp-toolbar-label">Type:</span>
  <button class="opp-type-btn active" data-type="ALL">ALL</button>
  <button class="opp-type-btn type-BILLING_GAP"        data-type="BILLING_GAP">Billing Gap</button>
  <button class="opp-type-btn type-API_ZERO"            data-type="API_ZERO">API Zero</button>
  <button class="opp-type-btn type-LOW_TAKE_RATE"       data-type="LOW_TAKE_RATE">Low Take Rate</button>
  <button class="opp-type-btn type-PENETRATION_UPSIDE"  data-type="PENETRATION_UPSIDE">Penetration Upside</button>
  <button class="opp-type-btn type-NO_ACTIVITY"         data-type="NO_ACTIVITY">No Activity</button>
  <div class="opp-toolbar-sep"></div>
  <span class="opp-toolbar-label">Confidence:</span>
  <button class="opp-conf-btn active" data-conf="ALL">All</button>
  <button class="opp-conf-btn conf-HIGH" data-conf="HIGH">High Confidence</button>
  <button class="opp-conf-btn conf-INVESTIGATE" data-conf="INVESTIGATE">Investigate</button>
  <div class="opp-toolbar-sep"></div>
  <span class="opp-toolbar-label">Status:</span>
  <button class="opp-status-btn active" data-status="open">Open</button>
  <button class="opp-status-btn" data-status="approved">Approved</button>
  <button class="opp-status-btn" data-status="rejected">Rejected</button>
  <button class="opp-status-btn" data-status="investigating">Investigating</button>
  <button class="opp-status-btn" data-status="all">All</button>
</div>

<!-- Decision flow label bar (updates when type filter changes) -->
<div class="opp-decision-bar" id="opp-decision-bar">
  <div class="tx-decision-label" id="opp-decision-text"></div>
</div>

<!-- Outcomes summary bar (shown when approved items exist) -->
<div class="opp-outcomes-summary" id="outcomes-summary-bar"></div>

<!-- Cards area -->
<div class="opp-cards-area">
  <div id="results-meta" class="opp-results-meta" style="display:none"></div>
  <div id="cards-container"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   OPPORTUNITIES PAGE
   ═══════════════════════════════════════════════════════════════════════════ */

const LS_DECISIONS_KEY = 'tx_opp_decisions';
const LS_COMMENTS_KEY  = 'tx_opp_comments';
let _supabaseCache = {};   // {opportunity_key: {decision, comment, ...}}
let _supabaseOK = false;

// ─── State ────────────────────────────────────────────────────────────────
let ALL_OPPS        = [];          // raw from JSON
let ACCOUNTS_MAP    = {};          // {company_id: account}
let FILTER_STATE    = null;        // from TXShared
let ACTIVE_TYPE     = 'ALL';
let ACTIVE_STATUS   = 'open';
let ACTIVE_CONF     = 'ALL';      // ALL | HIGH | INVESTIGATE

// ─── Outcome helpers ──────────────────────────────────────────────────────
const LS_ACTIONS_KEY = 'tx_opp_actions';

function loadActions() {
  try { return JSON.parse(localStorage.getItem(LS_ACTIONS_KEY) || '{}'); } catch { return {}; }
}
function saveActions(obj) {
  try { localStorage.setItem(LS_ACTIONS_KEY, JSON.stringify(obj)); } catch {}
}
function getAction(key) {
  // Supabase wins if available
  if (_supabaseCache[key] && _supabaseCache[key].action_taken) {
    return {
      action_taken:  _supabaseCache[key].action_taken  || '',
      action_date:   _supabaseCache[key].action_date   || '',
      action_owner:  _supabaseCache[key].action_owner  || '',
    };
  }
  return loadActions()[key] || { action_taken: '', action_date: '', action_owner: '' };
}
function setAction(key, actionData) {
  const acts = loadActions(); acts[key] = actionData; saveActions(acts);
  const opp = ALL_OPPS.find(o => o.opportunity_key === key);
  if (_supabaseOK && TXShared.Supabase) {
    TXShared.Supabase.saveDecision({
      opportunity_key:    key,
      company_id:         opp ? opp.company_id : '',
      company_name:       opp ? opp.company_name : '',
      opportunity_type:   opp ? opp.type : '',
      potential_amount:   opp ? opp.potential_amount : 0,
      decision:           getDecision(key),
      comment:            getComment(key),
      action_taken:       actionData.action_taken || null,
      action_date:        actionData.action_date  || null,
      action_owner:       actionData.action_owner || null,
    }).then(result => {
      if (result && result[0]) _supabaseCache[key] = { ..._supabaseCache[key], ...result[0] };
    });
  }
}
function getOutcome(key) {
  if (_supabaseCache[key]) {
    return {
      outcome_status:       _supabaseCache[key].outcome_status       || 'pending',
      metric_before:        _supabaseCache[key].metric_before        || null,
      metric_after:         _supabaseCache[key].metric_after         || null,
      outcome_measured_at:  _supabaseCache[key].outcome_measured_at  || null,
    };
  }
  return { outcome_status: 'pending', metric_before: null, metric_after: null, outcome_measured_at: null };
}

// ─── Decision helpers (Supabase + localStorage fallback) ──────────────────
function loadDecisions() {
  try { return JSON.parse(localStorage.getItem(LS_DECISIONS_KEY) || '{}'); } catch { return {}; }
}
function saveDecisions(obj) {
  try { localStorage.setItem(LS_DECISIONS_KEY, JSON.stringify(obj)); } catch {}
}
function loadComments() {
  try { return JSON.parse(localStorage.getItem(LS_COMMENTS_KEY) || '{}'); } catch { return {}; }
}
function saveComments(obj) {
  try { localStorage.setItem(LS_COMMENTS_KEY, JSON.stringify(obj)); } catch {}
}
function getDecision(key) {
  // Supabase first, then localStorage
  if (_supabaseCache[key]) return _supabaseCache[key].decision || 'open';
  return loadDecisions()[key] || 'open';
}
function setDecision(key, val) {
  // Write to localStorage immediately
  const d = loadDecisions(); d[key] = val; saveDecisions(d);
  // Async write to Supabase
  const opp = ALL_OPPS.find(o => o.opportunity_key === key);
  if (_supabaseOK && TXShared.Supabase) {
    TXShared.Supabase.saveDecision({
      opportunity_key: key,
      company_id: opp ? opp.company_id : '',
      company_name: opp ? opp.company_name : '',
      opportunity_type: opp ? opp.type : '',
      potential_amount: opp ? opp.potential_amount : 0,
      decision: val,
      comment: getComment(key),
    }).then(result => {
      if (result && result[0]) _supabaseCache[key] = result[0];
    });
  }
}
function getComment(key) {
  if (_supabaseCache[key] && _supabaseCache[key].comment) return _supabaseCache[key].comment;
  return loadComments()[key] || '';
}
function setComment(key, val) {
  // Write to localStorage immediately
  const c = loadComments(); c[key] = val; saveComments(c);
  // Async write to Supabase
  const opp = ALL_OPPS.find(o => o.opportunity_key === key);
  if (_supabaseOK && TXShared.Supabase) {
    TXShared.Supabase.saveDecision({
      opportunity_key: key,
      company_id: opp ? opp.company_id : '',
      company_name: opp ? opp.company_name : '',
      opportunity_type: opp ? opp.type : '',
      potential_amount: opp ? opp.potential_amount : 0,
      decision: getDecision(key),
      comment: val,
    }).then(result => {
      if (result && result[0]) _supabaseCache[key] = result[0];
    });
  }
}

// ─── Formatting ───────────────────────────────────────────────────────────
function fmtDollar(val) {
  if (val == null || isNaN(val)) return '—';
  if (Math.abs(val) >= 1e6) return '$' + (val / 1e6).toFixed(1) + 'M';
  if (Math.abs(val) >= 1e3) return '$' + (val / 1e3).toFixed(0) + 'K';
  return '$' + Math.round(val).toLocaleString();
}

function typeLabelMap(type) {
  return {
    BILLING_GAP:        'Billing Gap',
    API_ZERO:           'API Zero',
    LOW_TAKE_RATE:      'Low Take Rate',
    PENETRATION_UPSIDE: 'Penetration Upside',
    NO_ACTIVITY:        'No Activity',
  }[type] || type;
}

// ─── Filtering ────────────────────────────────────────────────────────────
function applyFilters(opps) {
  const fs = FILTER_STATE || {};
  let filtered = opps;

  // Shared filters (from TXShared via account data)
  if (fs.accountClass) {
    filtered = filtered.filter(o => {
      const acc = ACCOUNTS_MAP[o.company_id] || {};
      return acc.account_class === fs.accountClass;
    });
  }
  if (fs.businessType) {
    filtered = filtered.filter(o => o.business_type === fs.businessType);
  }
  if (fs.productTier) {
    filtered = filtered.filter(o => o.product_tier === fs.productTier);
  }
  if (fs.priority && fs.priority.length > 0) {
    filtered = filtered.filter(o => fs.priority.includes(o.priority_level));
  }
  if (fs.search) {
    const q = fs.search.toLowerCase();
    filtered = filtered.filter(o => (o.company_name || '').toLowerCase().includes(q));
  }

  // Type filter
  if (ACTIVE_TYPE !== 'ALL') {
    filtered = filtered.filter(o => o.type === ACTIVE_TYPE);
  }

  // Confidence filter
  if (ACTIVE_CONF === 'HIGH') {
    // HIGH confidence = confidence field is "HIGH" (BILLING_GAP, LOW_TAKE_RATE)
    filtered = filtered.filter(o => !o.confidence || o.confidence === 'HIGH');
  } else if (ACTIVE_CONF === 'INVESTIGATE') {
    // Investigate = confidence is "MEDIUM" or "LOW"
    filtered = filtered.filter(o => o.confidence && (o.confidence === 'MEDIUM' || o.confidence === 'LOW'));
  }

  // Status filter
  if (ACTIVE_STATUS !== 'all') {
    filtered = filtered.filter(o => getDecision(o.opportunity_key) === ACTIVE_STATUS);
  }

  return filtered;
}

// ─── Summary bar ──────────────────────────────────────────────────────────
function renderSummaryBar(opps, summary) {
  const byType = summary.by_type || {};
  const totalPotential = summary.total_potential || 0;

  const approvedCount = opps.filter(o => getDecision(o.opportunity_key) === 'approved').length;
  const openCount     = opps.filter(o => getDecision(o.opportunity_key) === 'open').length;

  const typeChips = Object.entries(byType).map(([type, count]) => `
    <div class="opp-summary-item">
      <span class="opp-summary-value">${count}</span>
      <span class="opp-summary-label">${typeLabelMap(type)}</span>
    </div>
  `).join('');

  document.getElementById('summary-bar').innerHTML = `
    <div class="opp-summary-item">
      <span class="opp-summary-value blue">${summary.total}</span>
      <span class="opp-summary-label">Total Opportunities</span>
    </div>
    <div class="opp-summary-divider"></div>
    <div class="opp-summary-item">
      <span class="opp-summary-value green">${fmtDollar(totalPotential)}</span>
      <span class="opp-summary-label">Total Potential / yr</span>
    </div>
    <div class="opp-summary-divider"></div>
    ${typeChips}
    <div class="opp-summary-divider"></div>
    <div class="opp-summary-item">
      <span class="opp-summary-value amber">${openCount}</span>
      <span class="opp-summary-label">Open</span>
    </div>
    <div class="opp-summary-item">
      <span class="opp-summary-value green">${approvedCount}</span>
      <span class="opp-summary-label">Approved</span>
    </div>
  `;

  updateOutcomesSummaryBar();
}

// ─── Outcomes summary bar (separate strip below main summary) ─────────────
function updateOutcomesSummaryBar() {
  const bar = document.getElementById('outcomes-summary-bar');
  if (!bar || !ALL_OPPS.length) return;

  const approved    = ALL_OPPS.filter(o => getDecision(o.opportunity_key) === 'approved');
  const actionTaken = ALL_OPPS.filter(o => {
    const a = getAction(o.opportunity_key);
    return a.action_taken && a.action_taken.trim().length > 0;
  });
  const measured    = ALL_OPPS.filter(o => {
    const out = getOutcome(o.opportunity_key);
    return out.outcome_status !== 'pending' && out.metric_after;
  });
  const converted   = ALL_OPPS.filter(o => getOutcome(o.opportunity_key).outcome_status === 'converted');

  const hitRate = measured.length > 0
    ? Math.round((converted.length / measured.length) * 100)
    : null;

  const hitRateStr = hitRate !== null ? `${hitRate}%` : '—';

  if (approved.length === 0 && actionTaken.length === 0 && measured.length === 0) {
    bar.classList.remove('visible');
    return;
  }

  bar.classList.add('visible');
  bar.innerHTML = `
    <span class="opp-outcomes-summary-label">Outcomes</span>
    <span class="opp-outcomes-summary-stat"><strong>${approved.length}</strong> approved</span>
    <span class="opp-outcomes-summary-stat amber"><strong>${actionTaken.length}</strong> action taken</span>
    <span class="opp-outcomes-summary-stat"><strong>${measured.length}</strong> measured</span>
    <span class="opp-outcomes-summary-stat"><strong>${converted.length}</strong> converted &nbsp;·&nbsp; hit rate: <strong>${hitRateStr}</strong></span>
  `;
}

// ─── Card rendering ───────────────────────────────────────────────────────
function renderCard(opp) {
  const key      = opp.opportunity_key;
  const decision = getDecision(key);
  const comment  = getComment(key);
  const hasComment = comment.trim().length > 0;
  const action   = getAction(key);
  const hasAction = action.action_taken && action.action_taken.trim().length > 0;
  const outcome  = getOutcome(key);
  const showOutcomeToggle = (decision === 'approved' || decision === 'investigating');

  const statusClass = decision !== 'open' ? `status-${decision}` : '';

  const approveActive = decision === 'approved'     ? 'active' : '';
  const rejectActive  = decision === 'rejected'     ? 'active' : '';
  const investActive  = decision === 'investigating'? 'active' : '';

  let statusBadge = '';
  if (decision !== 'open') {
    const badgeCls = `status-badge-${decision}`;
    const label    = decision.charAt(0).toUpperCase() + decision.slice(1);
    statusBadge = `<span class="opp-status-badge ${badgeCls}">${label}</span>`;
  }

  // ── Outcome result card HTML ──
  let outcomeResultHtml = '';
  if (outcome.metric_before && outcome.metric_after && outcome.outcome_status !== 'pending') {
    const mb = outcome.metric_before;
    const ma = outcome.metric_after;
    const statusLabel = {
      converted:     'CONVERTED ✓',
      not_converted: 'NOT CONVERTED ✗',
      partial:       'PARTIAL →',
      expired:       'EXPIRED —',
    }[outcome.outcome_status] || outcome.outcome_status.toUpperCase();

    const feesDelta  = (ma.fees  != null && mb.fees  != null) ? (ma.fees  - mb.fees)  : null;
    const sellDelta  = (ma.sell  != null && mb.sell  != null) ? (ma.sell  - mb.sell)  : null;

    const feesDeltaHtml  = feesDelta  != null ? `<span class="opp-outcome-delta ${feesDelta >= 0 ? 'pos' : 'neg'}">${feesDelta >= 0 ? '+' : ''}${fmtDollar(feesDelta)}</span>` : '';
    const sellDeltaHtml  = sellDelta  != null ? `<span class="opp-outcome-delta ${sellDelta >= 0 ? 'pos' : 'neg'}">${sellDelta >= 0 ? '+' : ''}${fmtDollar(sellDelta)}</span>` : '';

    const measuredAt = outcome.outcome_measured_at
      ? `<span style="font-size:9px;color:#94a3b8;margin-top:4px;display:block">Measured ${escHtml(outcome.outcome_measured_at)}</span>`
      : '';

    // Annualized value for converted (fee delta × 12)
    let annualHtml = '';
    if (outcome.outcome_status === 'converted' && feesDelta != null && feesDelta > 0) {
      annualHtml = `<span style="font-size:11px;color:#16a34a;font-weight:700">&nbsp;(${fmtDollar(feesDelta * 12)}/yr)</span>`;
    }

    outcomeResultHtml = `
      <div class="opp-outcome-result has-outcome outcome-${outcome.outcome_status}" id="outcome-result-${key}">
        <div class="opp-outcome-result-header" style="display:flex;align-items:center;gap:8px">
          <span>OUTCOME: ${escHtml(opp.company_name)}</span>
          <span class="opp-outcome-status-badge badge-outcome-${outcome.outcome_status}">${statusLabel}${annualHtml}</span>
        </div>
        <div class="opp-outcome-metrics">
          <div class="opp-outcome-metric-col">
            <span class="opp-outcome-metric-period">Before${mb.period ? ' (' + escHtml(mb.period) + ')' : ''}</span>
            ${mb.fees  != null ? `<div class="opp-outcome-metric-row"><span class="opp-outcome-metric-label">Fees</span><span class="opp-outcome-metric-val">${fmtDollar(mb.fees)}</span></div>` : ''}
            ${mb.sell  != null ? `<div class="opp-outcome-metric-row"><span class="opp-outcome-metric-label">Sell</span><span class="opp-outcome-metric-val">${fmtDollar(mb.sell)}</span></div>` : ''}
            ${mb.buy   != null ? `<div class="opp-outcome-metric-row"><span class="opp-outcome-metric-label">Buy</span><span class="opp-outcome-metric-val">${fmtDollar(mb.buy)}</span></div>` : ''}
          </div>
          <div class="opp-outcome-metric-col">
            <span class="opp-outcome-metric-period">After${ma.period ? ' (' + escHtml(ma.period) + ')' : ''}</span>
            ${ma.fees  != null ? `<div class="opp-outcome-metric-row"><span class="opp-outcome-metric-label">Fees</span><span class="opp-outcome-metric-val">${fmtDollar(ma.fees)}</span> ${feesDeltaHtml}</div>` : ''}
            ${ma.sell  != null ? `<div class="opp-outcome-metric-row"><span class="opp-outcome-metric-label">Sell</span><span class="opp-outcome-metric-val">${fmtDollar(ma.sell)}</span> ${sellDeltaHtml}</div>` : ''}
            ${ma.buy   != null ? `<div class="opp-outcome-metric-row"><span class="opp-outcome-metric-label">Buy</span><span class="opp-outcome-metric-val">${fmtDollar(ma.buy)}</span></div>` : ''}
          </div>
        </div>
        ${measuredAt}
      </div>
    `;
  }

  // ── Action display HTML (existing action, if set) ──
  let actionDisplayHtml = '';
  if (hasAction) {
    actionDisplayHtml = `
      <div class="opp-action-display has-data" id="action-display-${key}">
        <div class="action-field"><span class="action-key">Action</span><span class="action-val">${escHtml(action.action_taken)}</span></div>
        ${action.action_owner ? `<div class="action-field"><span class="action-key">Owner</span><span class="action-val">${escHtml(action.action_owner)}</span></div>` : ''}
        ${action.action_date  ? `<div class="action-field"><span class="action-key">Date</span><span class="action-val">${escHtml(action.action_date)}</span></div>` : ''}
        <button class="opp-action-edit-btn" onclick="showActionForm('${key}')">Edit</button>
      </div>
    `;
  }

  // ── Record Action form ──
  const actionFormDisplay = hasAction ? 'none' : 'flex';
  const actionFormHtml = `
    <div class="opp-action-form" id="action-form-${key}" style="display:${actionFormDisplay}">
      <div class="opp-action-form-group">
        <span class="opp-action-form-label">Action taken</span>
        <input class="opp-action-form-input wide" id="action-input-${key}"
               type="text" placeholder="e.g. Scheduled billing correction call…"
               value="${escHtml(action.action_taken)}">
      </div>
      <div class="opp-action-form-group">
        <span class="opp-action-form-label">Owner</span>
        <input class="opp-action-form-input medium" id="action-owner-${key}"
               type="text" placeholder="e.g. Facu"
               value="${escHtml(action.action_owner)}">
      </div>
      <div class="opp-action-form-group">
        <span class="opp-action-form-label">Date</span>
        <input class="opp-action-form-input narrow" id="action-date-${key}"
               type="date" value="${escHtml(action.action_date)}">
      </div>
      <button class="opp-action-save" onclick="saveAction('${key}')">Save</button>
      <span class="opp-action-saved-flash" id="action-saved-${key}">&#10003; Saved</span>
    </div>
  `;

  // ── Probability badge (graceful degradation if field missing) ──
  let probBadgeHtml = '';
  if (opp.probability != null) {
    const p = opp.probability;
    const pClass = p >= 0.6 ? 'prob-green' : (p >= 0.3 ? 'prob-amber' : 'prob-red');
    const pLabel = 'P: ' + Math.round(p * 100) + '%';
    probBadgeHtml = `<span class="opp-prob-badge ${pClass}">${pLabel}</span>`;
  }

  // ── So What + Action text (graceful degradation) ──
  const soWhatHtml = opp.so_what
    ? `<div class="opp-card-sowhat">So what: ${escHtml(opp.so_what)}</div>`
    : '';
  const actionTextHtml = opp.action
    ? `<div class="opp-card-action-text">Action: ${escHtml(opp.action)}</div>`
    : '';

  return `
    <div class="opp-card ${statusClass}" data-key="${key}" id="card-${key}">
      <div class="opp-card-header">
        <div class="opp-card-title-block">
          <span class="opp-type-badge badge-${opp.type}">${typeLabelMap(opp.type)}</span>
          <span class="opp-card-name">${escHtml(opp.company_name)}</span>
          <span class="opp-card-tier">(${escHtml(opp.product_tier)})</span>
          ${statusBadge}
        </div>
      </div>
      <div class="opp-card-meta">
        <span class="opp-card-potential">${fmtDollar(opp.potential_amount)}</span>
        ${probBadgeHtml}
        <span class="opp-card-priority">Priority: <span>${escHtml(opp.priority_level)}</span></span>
        <span class="opp-card-priority">Business: <span>${escHtml(opp.business_type)}</span></span>
      </div>
      <div class="opp-card-evidence">
        <span class="evidence-label">Evidence</span>
        ${escHtml(opp.evidence)}
        ${soWhatHtml}
        ${actionTextHtml}
      </div>
      <div class="opp-card-actions">
        <button class="opp-action-btn opp-btn-approve ${approveActive}"
                onclick="handleDecision('${key}', 'approved')">&#10003; Approve</button>
        <button class="opp-action-btn opp-btn-reject ${rejectActive}"
                onclick="handleDecision('${key}', 'rejected')">&#10007; Not real</button>
        <button class="opp-action-btn opp-btn-investigate ${investActive}"
                onclick="handleDecision('${key}', 'investigating')">&#8594; Investigate</button>
        <button class="opp-action-btn opp-btn-comment-toggle"
                onclick="toggleComment('${key}')">&#128172; Comment${hasComment ? ' (1)' : ''}</button>
        ${showOutcomeToggle ? `<button class="opp-action-btn opp-btn-outcome-toggle" onclick="toggleOutcome('${key}')">&#9654; Outcome${hasAction ? ' ✓' : ''}</button>` : ''}
      </div>
      <div class="opp-comment-section ${hasComment ? 'open' : ''}" id="comment-${key}">
        ${hasComment ? `<div class="opp-comment-display" id="comment-display-${key}">"${escHtml(comment)}"</div>` : ''}
        <div class="opp-comment-area">
          <textarea class="opp-comment-input" id="comment-input-${key}"
            placeholder="Add a note…" rows="2">${escHtml(comment)}</textarea>
          <button class="opp-comment-save" onclick="saveComment('${key}')">Save</button>
        </div>
        <span class="opp-comment-saved" id="comment-saved-${key}">&#10003; Saved</span>
      </div>
      <div class="opp-outcome-section" id="outcome-${key}">
        ${outcomeResultHtml}
        ${actionDisplayHtml}
        ${actionFormHtml}
      </div>
    </div>
  `;
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ─── Decision handlers ────────────────────────────────────────────────────
function handleDecision(key, action) {
  const current = getDecision(key);
  // Toggle: clicking the active button resets to 'open'
  const next = (current === action) ? 'open' : action;
  setDecision(key, next);
  rerenderCard(key);
  updateResultsMeta();
  updateSummaryBar();
}

function toggleComment(key) {
  const section = document.getElementById(`comment-${key}`);
  if (section) section.classList.toggle('open');
}

function saveComment(key) {
  const input = document.getElementById(`comment-input-${key}`);
  if (!input) return;
  const val = input.value.trim();
  setComment(key, val);

  // Update display
  const display = document.getElementById(`comment-display-${key}`);
  if (display) {
    display.textContent = val ? `"${val}"` : '';
    display.style.display = val ? '' : 'none';
  } else if (val) {
    const section = document.getElementById(`comment-${key}`);
    const area = section.querySelector('.opp-comment-area');
    const newDisplay = document.createElement('div');
    newDisplay.className = 'opp-comment-display';
    newDisplay.id = `comment-display-${key}`;
    newDisplay.textContent = `"${val}"`;
    section.insertBefore(newDisplay, area);
  }

  // Flash saved
  const saved = document.getElementById(`comment-saved-${key}`);
  if (saved) {
    saved.style.display = 'flex';
    setTimeout(() => { saved.style.display = 'none'; }, 1800);
  }

  // Update comment toggle badge
  const card = document.getElementById(`card-${key}`);
  if (card) {
    const toggleBtn = card.querySelector('.opp-btn-comment-toggle');
    if (toggleBtn) toggleBtn.textContent = `💬 Comment${val ? ' (1)' : ''}`;
  }
}

function toggleOutcome(key) {
  const section = document.getElementById(`outcome-${key}`);
  if (section) section.classList.toggle('open');
}

function showActionForm(key) {
  const display = document.getElementById(`action-display-${key}`);
  const form    = document.getElementById(`action-form-${key}`);
  if (display) display.style.display = 'none';
  if (form)    form.style.display    = 'flex';
}

function saveAction(key) {
  const actionInput = document.getElementById(`action-input-${key}`);
  const ownerInput  = document.getElementById(`action-owner-${key}`);
  const dateInput   = document.getElementById(`action-date-${key}`);
  if (!actionInput) return;

  const actionData = {
    action_taken:  actionInput.value.trim(),
    action_owner:  ownerInput  ? ownerInput.value.trim()  : '',
    action_date:   dateInput   ? dateInput.value           : '',
  };

  setAction(key, actionData);

  // Flash saved
  const flash = document.getElementById(`action-saved-${key}`);
  if (flash) {
    flash.classList.add('show');
    setTimeout(() => {
      flash.classList.remove('show');
      // Full rerender to show action display mode
      rerenderCard(key);
      // Keep outcome section open if it was
      const section = document.getElementById(`outcome-${key}`);
      if (section && !section.classList.contains('open')) section.classList.add('open');
    }, 800);
  }

  updateOutcomesSummaryBar();
}

function rerenderCard(key) {
  const el = document.getElementById(`card-${key}`);
  if (!el) return;
  const opp = ALL_OPPS.find(o => o.opportunity_key === key);
  if (!opp) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderCard(opp);
  el.replaceWith(tmp.firstElementChild);
}

// ─── Main render ──────────────────────────────────────────────────────────
function render() {
  const filtered = applyFilters(ALL_OPPS);
  const container = document.getElementById('cards-container');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="opp-empty">
        <div class="opp-empty-icon">&#128269;</div>
        <div class="opp-empty-title">No opportunities match your filters</div>
        <div class="opp-empty-sub">Try adjusting type, status, or account filters.</div>
      </div>
    `;
  } else {
    container.innerHTML = filtered.map(o => renderCard(o)).join('');
  }

  updateResultsMeta(filtered);
}

function updateResultsMeta(filtered) {
  if (!filtered) filtered = applyFilters(ALL_OPPS);
  const meta = document.getElementById('results-meta');
  if (!meta) return;
  const total = filtered.length;
  const potential = filtered.reduce((s, o) => s + (o.potential_amount || 0), 0);
  meta.innerHTML = `
    <span>Showing <strong>${total}</strong> opportunities — <strong>${fmtDollar(potential)}</strong> potential</span>
  `;
}

function updateSummaryBar() {
  if (!ALL_OPPS.length) return;
  const totalPotential = ALL_OPPS.reduce((s, o) => s + (o.potential_amount || 0), 0);
  const byType = {};
  ALL_OPPS.forEach(o => { byType[o.type] = (byType[o.type] || 0) + 1; });
  // renderSummaryBar also calls updateOutcomesSummaryBar internally
  renderSummaryBar(ALL_OPPS, { total: ALL_OPPS.length, by_type: byType, total_potential: totalPotential });
}

// ─── Decision flow label (updates when type filter changes) ──────────────
const DECISION_LABELS = {
  ALL:                 null,
  BILLING_GAP:         'Decision: Is billing configured correctly?',
  API_ZERO:            'Decision: Should we negotiate API fee rates?',
  LOW_TAKE_RATE:       'Decision: Is the fee rate correct for this account?',
  PENETRATION_UPSIDE:  'Decision: Which accounts have the most offline GMV to digitalize?',
  NO_ACTIVITY:         'Decision: Why did this account stop transacting?',
};

function updateDecisionLabel(type) {
  const bar  = document.getElementById('opp-decision-bar');
  const text = document.getElementById('opp-decision-text');
  const label = DECISION_LABELS[type] || null;
  if (label) {
    text.textContent = label;
    bar.classList.add('visible');
  } else {
    text.textContent = '';
    bar.classList.remove('visible');
  }
}

// ─── Type/Status toolbar events ──────────────────────────────────────────
function initToolbar() {
  document.querySelectorAll('.opp-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.opp-type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ACTIVE_TYPE = btn.dataset.type;
      updateDecisionLabel(ACTIVE_TYPE);
      render();
      updateResultsMeta();
    });
  });
  document.querySelectorAll('.opp-status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.opp-status-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ACTIVE_STATUS = btn.dataset.status;
      render();
      updateResultsMeta();
    });
  });

  document.querySelectorAll('.opp-conf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.opp-conf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ACTIVE_CONF = btn.dataset.conf;
      render();
      updateResultsMeta();
    });
  });
}

// ─── Filter change handler (called by TXShared) ──────────────────────────
function onFilterChange(state) {
  FILTER_STATE = state;
  render();
  updateResultsMeta();
}

// ─── Boot ─────────────────────────────────────────────────────────────────
(async function boot() {
  // 1. Init shared (nav + filter bar)
  FILTER_STATE = TXShared.init('opportunities', 'filter-container', onFilterChange);
  TXShared.renderScorecard('scorecard-container');

  // 2. Show toolbar
  document.getElementById('opp-toolbar').style.display = 'flex';
  document.getElementById('results-meta').style.display = 'flex';

  // 3. Init toolbar events
  initToolbar();

  // 4. Load data
  try {
    const [oppData, accountsRaw] = await Promise.all([
      TXShared.loadJSON('data/opportunities.json'),
      TXShared.loadJSON('data/accounts_v3.json'),
    ]);

    // Build accounts map
    const accts = accountsRaw.accounts || accountsRaw;
    accts.forEach(a => { ACCOUNTS_MAP[String(a.company_id)] = a; });

    // Store opps (already sorted by expected_value desc from generator)
    ALL_OPPS = oppData.opportunities || [];

    // Data freshness bar
    if (oppData.generated_at) {
      const freshnessBar  = document.getElementById('opp-freshness-bar');
      const freshnessDate = document.getElementById('opp-freshness-date');
      if (freshnessBar && freshnessDate) {
        freshnessDate.textContent = oppData.generated_at;
        freshnessBar.style.display = '';
      }
    }

    // 5. Load Supabase decisions (async, non-blocking)
    try {
      const sbDecisions = await TXShared.Supabase.getDecisions();
      if (sbDecisions) {
        _supabaseCache = sbDecisions;
        _supabaseOK = true;
        console.log(`Supabase connected: ${Object.keys(sbDecisions).length} decisions loaded`);
        // Merge Supabase decisions into localStorage (Supabase wins)
        const lsDec = loadDecisions();
        const lsCom = loadComments();
        const lsActs = loadActions();
        Object.entries(sbDecisions).forEach(([key, row]) => {
          if (row.decision && row.decision !== 'open') lsDec[key] = row.decision;
          if (row.comment) lsCom[key] = row.comment;
          // Merge action fields
          if (row.action_taken || row.action_date || row.action_owner) {
            lsActs[key] = {
              action_taken:  row.action_taken  || '',
              action_date:   row.action_date   || '',
              action_owner:  row.action_owner  || '',
            };
          }
        });
        saveDecisions(lsDec);
        saveComments(lsCom);
        saveActions(lsActs);
      }
    } catch (e) { console.warn('Supabase sync skipped:', e.message); }

    // Render summary bar (also calls updateOutcomesSummaryBar internally)
    renderSummaryBar(ALL_OPPS, oppData.summary || {});

    // Render cards
    render();

  } catch (err) {
    console.error('Failed to load opportunity data:', err);
    document.getElementById('summary-bar').innerHTML = '';
    document.getElementById('cards-container').innerHTML = `
      <div class="opp-error">
        <strong>Failed to load opportunities data.</strong><br>
        Run <code>scripts/generate_opportunities.py</code> to generate
        <code>data/opportunities.json</code>, then reload this page.<br><br>
        Error: ${err.message}
      </div>
    `;
  }
})();
</script>
</body>
