<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>V3 Minimal</title>
<style>
body { font-family: sans-serif; font-size: 12px; margin: 20px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
th { background: #f5f5f5; font-size: 10px; }
.gmv-value { font-weight: 700; }
.prov-tag { font-size: 9px; padding: 1px 4px; border-radius: 3px; }
.prov-medido { background: #dcfce7; color: #166534; }
.prov-ora { background: #dbeafe; color: #1e40af; }
.prov-piso { background: #fef3c7; color: #92400e; }
.badge { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-right: 3px; }
.badge-wh { background: #dbeafe; color: #1e40af; }
.badge-imp { background: #ccfbf1; color: #0f766e; }
.badge-grw { background: #dcfce7; color: #166534; }
.badge-ret { background: #f3e8ff; color: #7c3aed; }
#status { padding: 10px; background: #f0f0f0; margin-bottom: 10px; }
</style>
</head><body>
<div id="status">Loading adapter...</div>
<table id="portfolio">
<thead><tr>
<th>Account</th><th>Type</th><th>Tier</th><th>Potential</th><th>Engagement</th>
<th>Est GMV</th><th>Source</th><th>Sell YTD</th><th>% Digital</th><th>Fees YTD</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<script src="evidence_adapter_v3.js"></script>
<script>
var status = document.getElementById('status');
var tbody = document.getElementById('tbody');

function fmt$(n) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + Math.round(n).toLocaleString();
}

function fmtPct(n) { return n != null ? n.toFixed(1) + '%' : '—'; }

function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;') : ''; }

var btClass = { Wholesaler: 'badge-wh', Importer: 'badge-imp', Grower: 'badge-grw', Retailer: 'badge-ret' };

EvidenceAdapter.init().then(function() {
  var ids = EvidenceAdapter.getAllAccountIds();
  status.textContent = 'Loaded ' + ids.length + ' accounts. Rendering...';

  var html = '';
  var errors = 0;
  ids.forEach(function(cid, i) {
    try {
      var ev = EvidenceAdapter.getAccountEvidence(cid, 'ytd');
      if (!ev) return;
      var id = ev.identity || {};
      var p = ev.potential || {};
      var gmvRef = p.gmv_reference || {};
      var sellYtd = p.koronet_sell_ytd ? p.koronet_sell_ytd.value : null;
      var feesYtd = p.fees_ytd_2026 ? p.fees_ytd_2026.value : null;
      var digPct = id.digital_pct;

      html += '<tr>' +
        '<td><strong>' + esc(ev._company_name) + '</strong></td>' +
        '<td><span class="badge ' + (btClass[id.business_type]||'') + '">' + esc(id.business_type) + '</span></td>' +
        '<td>' + esc(id.product_tier) + '</td>' +
        '<td>' + esc(id.potential_tier) + '</td>' +
        '<td>' + esc(id.engagement_status) + '</td>' +
        '<td><span class="gmv-value">' + fmt$(gmvRef.value) + '</span></td>' +
        '<td><span class="prov-tag prov-' + (gmvRef.source === 'Medido' ? 'medido' : gmvRef.source === 'ORA' ? 'ora' : 'piso') + '">' + esc(gmvRef.source || '—') + '</span></td>' +
        '<td>' + fmt$(sellYtd) + '</td>' +
        '<td>' + fmtPct(digPct) + '</td>' +
        '<td>' + fmt$(feesYtd) + '</td>' +
        '</tr>';
    } catch(e) {
      errors++;
      html += '<tr><td colspan="10" style="color:red">ERROR ' + cid + ': ' + e.message + '</td></tr>';
    }
  });

  tbody.innerHTML = html;
  status.textContent = ids.length + ' accounts rendered. ' + errors + ' errors.';
}).catch(function(err) {
  status.textContent = 'INIT ERROR: ' + err.message;
});
</script>
</body></html>
